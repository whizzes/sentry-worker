[package]
name = "sentry-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ['json', 'macros', 'query'] }
send_wrapper = { version = "0.6", features = ["futures"] }
serde = { version = "1.0", features = ['derive'] }
serde_json = "1.0"
tower-service = "0.3"
url = "2"
worker = { version = "0.8", features = ['http', 'axum'] }
worker-macros = { version = "0.8", features = ['http'] }
